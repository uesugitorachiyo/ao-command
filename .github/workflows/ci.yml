name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

jobs:
  windows-default-environment:
    name: windows-default-environment
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      PYTHONUTF8: "0"
    defaults:
      run:
        shell: pwsh
        working-directory: AO Command Default Windows
    steps:
      - name: Configure checkout conversion
        shell: pwsh
        working-directory: .
        run: |
          git config --global core.autocrlf true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout ao-command
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: AO Command Default Windows
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: AO Command Default Windows/go.mod
          cache: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Verify default Windows checkout
        run: |
          if ((Get-Location).Path -notmatch ' ') { throw 'checkout path must contain spaces' }
          $autocrlf = git config --global --get core.autocrlf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($autocrlf -ne 'true') { throw 'core.autocrlf must be true' }
          if ($env:PYTHONUTF8 -ne '0') { throw 'PYTHONUTF8 must be 0' }

          $claude = [System.IO.File]::ReadAllBytes('CLAUDE.md')
          if ([Convert]::ToHexString($claude) -ne '404147454E54532E6D640A') { throw 'CLAUDE.md must contain exact ASCII @AGENTS.md plus LF' }

          $eol = @(git ls-files --eol -- '*.go' '*.sh' 'CLAUDE.md' 'examples/mission/artifacts/sha256/*')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $goEOL = @($eol | Where-Object { $_ -match '\.go$' })
          $bashEOL = @($eol | Where-Object { $_ -match '\.sh$' })
          $claudeEOL = @($eol | Where-Object { $_ -match 'CLAUDE\.md$' })
          $digestEOL = @($eol | Where-Object { $_ -match 'examples/mission/artifacts/sha256/' })
          if ($goEOL.Count -eq 0 -or @($goEOL | Where-Object { $_ -notmatch 'w/lf\s+attr/text eol=lf\s+' }).Count -ne 0) { throw 'Go files must be w/lf with attr/text eol=lf' }
          if ($bashEOL.Count -eq 0 -or @($bashEOL | Where-Object { $_ -notmatch 'w/lf\s+attr/text eol=lf\s+' }).Count -ne 0) { throw 'Bash files must be w/lf with attr/text eol=lf' }
          if ($claudeEOL.Count -ne 1 -or $claudeEOL[0] -notmatch 'w/lf\s+attr/text eol=lf\s+') { throw 'CLAUDE.md must be w/lf with attr/text eol=lf' }
          if ($digestEOL.Count -eq 0 -or @($digestEOL | Where-Object { $_ -notmatch 'attr/-text\s+' }).Count -ne 0) { throw 'digest fixtures must be attr/-text' }

      - name: Check formatting
        run: |
          $unformatted = gofmt -l .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) {
            $unformatted
            exit 1
          }

      - name: Test
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vet
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          go build -o (Join-Path $env:RUNNER_TEMP 'ao-command.exe') ./cmd/ao-command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check diff
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  license-policy:
    name: License policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ao-command
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check license policy
        run: scripts/check-license-policy.sh

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ao-command
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout ao-forge integration fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao-forge
          path: ao-forge

      - name: Checkout ao-foundry active-stack fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao-foundry
          path: ao-foundry

      - name: Checkout ao-covenant claim-boundary fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao-covenant
          path: ao-covenant

      - name: Checkout ao-architecture RSI manifest fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao-architecture
          path: ao-architecture

      - name: Checkout pinned AO Architecture parity oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao-architecture
          ref: b8c64860003238ab45fe7c76d7e8950f80a4043b
          path: ao-architecture-parity

      - name: Checkout pinned AO2 discovery producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao2
          ref: 53e45313e8031071d730601a64be22b4d9b0c7fe
          path: ao2-discovery-producer
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Replay pinned AO2 discovery producer
        run: |
          test "$(git -C ao2-discovery-producer rev-parse HEAD)" = "53e45313e8031071d730601a64be22b4d9b0c7fe"
          mkdir -p tmp/github-issue-repair
          cargo run --locked \
            --manifest-path ao2-discovery-producer/Cargo.toml \
            --bin ao2 -- issue discover \
            --page-envelope examples/github-issue-repair/discovery-page-envelope.valid.json \
            --url "https://github.com/example/repair-fixture/issues/?ignored=yes#fragment" \
            --repository example/repair-fixture \
            --default-branch master \
            --head-sha 1111111111111111111111111111111111111111 \
            --run-id repair-run-20260728 \
            --completed-at 2026-07-27T23:00:00Z \
            --snapshot-limit 50 \
            --candidate-limit 10 \
            --json > tmp/github-issue-repair/discovery-result.json
          cmp \
            examples/github-issue-repair/discovery-result.valid.json \
            tmp/github-issue-repair/discovery-result.json

      - name: Consume replayed AO2 discovery output
        run: |
          go run ./cmd/ao-command github-issue repair-readback \
            --discovery tmp/github-issue-repair/discovery-result.json \
            --json > tmp/github-issue-repair/readback.json
          test "$(jq -r .status tmp/github-issue-repair/readback.json)" = "candidate_selected"
          test "$(jq -r .operator_mode tmp/github-issue-repair/readback.json)" = "read_only"
          test "$(jq -r .mutates_github tmp/github-issue-repair/readback.json)" = "false"

      - name: Test
        env:
          AO_ARCHITECTURE_REPO: ${{ github.workspace }}/ao-architecture-parity
          AO_ARCHITECTURE_PARITY_REQUIRED: "true"
        run: |
          test "$(git -C "$AO_ARCHITECTURE_REPO" rev-parse HEAD)" = "b8c64860003238ab45fe7c76d7e8950f80a4043b"
          go test ./... -count=1

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o bin/ao-command ./cmd/ao-command

      - name: RSI health dry-run
        run: |
          mkdir -p tmp/rsi-health
          cat > tmp/rsi-health/arena-promotion-gate.json <<'JSON'
          {
            "schema_version": "ao.arena.promotion-gate.v0.1",
            "status": "passed",
            "winner": "ao-orchestration"
          }
          JSON
          cat > tmp/rsi-health/crucible-hardening-gate.json <<'JSON'
          {
            "schema_version": "ao.crucible.hardening-gate.v0.1",
            "status": "passed",
            "score": 97
          }
          JSON
          cat > tmp/rsi-health/sentinel-verdict.json <<'JSON'
          {
            "schema_version": "ao.sentinel.verdict.v0.1",
            "verdict": "clear",
            "safety_status": "passed",
            "regression_status": "passed",
            "promoter_hold_required": false,
            "mutates_live_state": false
          }
          JSON
          cat > tmp/rsi-health/promoter-gate.json <<'JSON'
          {
            "schema_version": "ao.promoter.gate.v0.1",
            "status": "passed",
            "promotion_allowed": true,
            "activation_plan_allowed": true,
            "blockers": []
          }
          JSON
          cat > tmp/rsi-health/foundry-rsi-improvement-gate.json <<'JSON'
          {
            "schema_version": "ao.foundry.rsi-improvement-gate.v0.1",
            "status": "passed",
            "baseline_score": 90,
            "candidate_score": 100,
            "required_improvement_percent": 5,
            "actual_improvement_percent": 10,
            "autonomous_claim": "measured_local_improvement",
            "mutates_repositories": false,
            "evidence": [
              {
                "label": "baseline",
                "path": "examples/evals/rsi-baseline.eval-result.json",
                "schema_version": "ao.foundry.eval-result.v0.1",
                "status": "ready",
                "score": 90,
                "max_score": 100,
                "sha256": "e5824cee9ef1455fcdc74dfecc7e30710edb5ef67cb939eff92d57283dfdc52e"
              },
              {
                "label": "candidate",
                "path": "tmp/pulse-rsi-verify/eval-result.json",
                "schema_version": "ao.foundry.eval-result.v0.1",
                "status": "ready",
                "score": 100,
                "max_score": 100,
                "sha256": "cf3f99d1b1639ef2fd2ba24cb75481211c0c4b0ad8e81605be5fbd6e3f7f39ec"
              }
            ]
          }
          JSON
          cat > tmp/rsi-health/foundry-rsi-candidate.json <<'JSON'
          {
            "schema_version": "ao.foundry.rsi-candidate.v0.1",
            "status": "ready",
            "generated_by": "foundry pulse run",
            "improvement_hypothesis": "Local pulse generated the candidate eval result from the current Foundry run before measuring the RSI improvement gate.",
            "baseline_eval_result": {
              "path": "examples/evals/rsi-baseline.eval-result.json",
              "schema_version": "ao.foundry.eval-result.v0.1",
              "status": "ready",
              "score": 90,
              "max_score": 100,
              "sha256": "e5824cee9ef1455fcdc74dfecc7e30710edb5ef67cb939eff92d57283dfdc52e"
            },
            "candidate_eval_result": {
              "path": "tmp/pulse-rsi-verify/eval-result.json",
              "schema_version": "ao.foundry.eval-result.v0.1",
              "status": "ready",
              "score": 100,
              "max_score": 100,
              "sha256": "cf3f99d1b1639ef2fd2ba24cb75481211c0c4b0ad8e81605be5fbd6e3f7f39ec"
            },
            "mutates_repositories": false,
            "next_actions": []
          }
          JSON
          cat > tmp/rsi-health/foundry-rsi-next-improvement-task.json <<'JSON'
          {
            "schema_version": "ao.foundry.rsi-next-improvement-task.v0.1",
            "status": "ready",
            "generated_by": "foundry pulse run",
            "goal_id": "ao-foundry-production-readiness",
            "recommended_task_id": "rsi-next-ci",
            "recommended_action": "retain the next bounded RSI improvement task as governed evidence",
            "improvement_rationale": "The local pulse produced an RSI candidate and a passing improvement gate, so the next bounded task can be retained as governed evidence before delegation.",
            "candidate_evidence_path": "tmp/rsi-health/foundry-rsi-candidate.json",
            "gate_evidence_path": "tmp/rsi-health/foundry-rsi-improvement-gate.json",
            "required_improvement_percent": 5,
            "actual_improvement_percent": 10,
            "autonomous_claim": "derived_local_next_improvement",
            "mutates_repositories": false,
            "next_actions": [
              "retain rsi_next_improvement_task with RSI candidate and gate evidence"
            ]
          }
          JSON
          cat > tmp/rsi-health/forge-retained-foundry-rsi-improvement-gate.json <<'JSON'
          {
            "schema_version": "ao.forge.goal-run-retained-evidence.v0.1",
            "goal_id": "ao2-weekend-hardening",
            "iteration": "20260619T180000Z-verification",
            "phase": "verification",
            "summary": "Retained AO Foundry RSI improvement gate.",
            "captured_outputs": [
              {
                "label": "ao-foundry-rsi-improvement-gate",
                "command": "foundry pulse run",
                "schema_version": "ao.foundry.rsi-improvement-gate.v0.1",
                "status": "passed",
                "baseline_score": 90,
                "candidate_score": 100,
                "required_improvement_percent": 5,
                "actual_improvement_percent": 10,
                "autonomous_claim": "measured_local_improvement",
                "mutates_repositories": false
              }
            ],
            "retention_policy": {
              "layout": "docs/evidence/goals/<goal_id>/<YYYYMMDDTHHMMSSZ>-<phase>/",
              "temporary_paths_allowed": false,
              "minimum_retention_days_after_terminal_phase": 90
            },
            "retention_metadata": {
              "retained_at": "2026-06-19T18:00:00Z",
              "retention_class": "loop_evidence",
              "retain_while_goal_active": true,
              "deletion_requires_review": true,
              "cleanup_change_must_name": ["goal_id", "iteration", "reason"]
            }
          }
          JSON
          cat > tmp/rsi-health/forge-retained-foundry-rsi-candidate.json <<'JSON'
          {
            "schema_version": "ao.forge.goal-run-retained-evidence.v0.1",
            "goal_id": "ao2-weekend-hardening",
            "iteration": "20260619T180000Z-verification",
            "phase": "verification",
            "summary": "Retained AO Foundry RSI candidate evidence.",
            "captured_outputs": [
              {
                "label": "ao-foundry-rsi-candidate",
                "command": "foundry pulse run",
                "schema_version": "ao.foundry.rsi-candidate.v0.1",
                "status": "ready",
                "generated_by": "foundry pulse run",
                "baseline_score": 90,
                "candidate_score": 100,
                "mutates_repositories": false
              }
            ],
            "retention_policy": {
              "layout": "docs/evidence/goals/<goal_id>/<YYYYMMDDTHHMMSSZ>-<phase>/",
              "temporary_paths_allowed": false,
              "minimum_retention_days_after_terminal_phase": 90
            },
            "retention_metadata": {
              "retained_at": "2026-06-19T18:00:00Z",
              "retention_class": "loop_evidence",
              "retain_while_goal_active": true,
              "deletion_requires_review": true,
              "cleanup_change_must_name": ["goal_id", "iteration", "reason"]
            }
          }
          JSON
          cat > tmp/rsi-health/forge-retained-foundry-rsi-next-improvement-task.json <<'JSON'
          {
            "schema_version": "ao.forge.goal-run-retained-evidence.v0.1",
            "goal_id": "ao2-weekend-hardening",
            "iteration": "20260619T180000Z-verification",
            "phase": "verification",
            "summary": "Retained AO Foundry RSI next improvement task.",
            "captured_outputs": [
              {
                "label": "ao-foundry-rsi-next-improvement-task",
                "command": "foundry pulse run",
                "schema_version": "ao.foundry.rsi-next-improvement-task.v0.1",
                "status": "ready",
                "required_improvement_percent": 5,
                "actual_improvement_percent": 10,
                "autonomous_claim": "derived_local_next_improvement",
                "mutates_repositories": false
              }
            ],
            "retention_policy": {
              "layout": "docs/evidence/goals/<goal_id>/<YYYYMMDDTHHMMSSZ>-<phase>/",
              "temporary_paths_allowed": false,
              "minimum_retention_days_after_terminal_phase": 90
            },
            "retention_metadata": {
              "retained_at": "2026-06-19T18:00:00Z",
              "retention_class": "loop_evidence",
              "retain_while_goal_active": true,
              "deletion_requires_review": true,
              "cleanup_change_must_name": ["goal_id", "iteration", "reason"]
            }
          }
          JSON
          cat > tmp/rsi-health/forge-retained-command-rsi-health.json <<'JSON'
          {
            "schema_version": "ao.forge.goal-run-retained-evidence.v0.1",
            "goal_id": "ao2-weekend-hardening",
            "iteration": "20260619T180000Z-verification",
            "phase": "verification",
            "summary": "Retained AO Command RSI health output.",
            "captured_outputs": [
              {
                "label": "ao-command-rsi-health",
                "command": "ao-command rsi health",
                "status": "passed",
                "rsi_mode": "governed_fixture_local",
                "rsi_capability": "demonstrated_local_fixture_loop",
                "operator_mode": "read_only",
                "mutates_repositories": false,
                "families": [
                  {"family": "ao-arena", "status": "passed", "passed": true},
                  {"family": "ao-crucible", "status": "passed", "passed": true},
                  {"family": "ao-sentinel", "status": "clear", "passed": true},
                  {"family": "ao-promoter", "status": "passed", "passed": true},
                  {"family": "ao-foundry", "status": "passed", "passed": true}
                ]
              }
            ],
            "retention_policy": {
              "layout": "docs/evidence/goals/<goal_id>/<YYYYMMDDTHHMMSSZ>-<phase>/",
              "temporary_paths_allowed": false,
              "minimum_retention_days_after_terminal_phase": 90
            },
            "retention_metadata": {
              "retained_at": "2026-06-19T18:00:00Z",
              "retention_class": "loop_evidence",
              "retain_while_goal_active": true,
              "deletion_requires_review": true,
              "cleanup_change_must_name": ["goal_id", "iteration", "reason"]
            }
          }
          JSON
          bin/ao-command rsi health \
            --arena-gate tmp/rsi-health/arena-promotion-gate.json \
            --crucible-gate tmp/rsi-health/crucible-hardening-gate.json \
            --sentinel-verdict tmp/rsi-health/sentinel-verdict.json \
            --promoter-gate tmp/rsi-health/promoter-gate.json \
            --foundry-gate tmp/rsi-health/foundry-rsi-improvement-gate.json \
            --foundry-candidate tmp/rsi-health/foundry-rsi-candidate.json \
            --foundry-next-task tmp/rsi-health/foundry-rsi-next-improvement-task.json \
            --forge-retained-gate tmp/rsi-health/forge-retained-foundry-rsi-improvement-gate.json \
            --forge-retained-candidate tmp/rsi-health/forge-retained-foundry-rsi-candidate.json \
            --forge-retained-next-task tmp/rsi-health/forge-retained-foundry-rsi-next-improvement-task.json \
            --forge-retained-command-health tmp/rsi-health/forge-retained-command-rsi-health.json \
            --bundle-out tmp/rsi-health/rsi-health-bundle.json \
            --json > tmp/rsi-health/ao-command-rsi-health.json
          test -s tmp/rsi-health/ao-command-rsi-health.json
          test -s tmp/rsi-health/rsi-health-bundle.json

      - name: Validate RSI health contract
        run: |
          go run ./cmd/ao-command evidence \
            --forge ao-forge \
            --schema "$PWD/docs/contracts/rsi-health-v0.1.schema.json" \
            --document "$PWD/tmp/rsi-health/ao-command-rsi-health.json"

      - name: Validate RSI health bundle contract
        run: |
          go run ./cmd/ao-command evidence \
            --forge ao-forge \
            --schema "$PWD/docs/contracts/rsi-health-bundle-v0.1.schema.json" \
            --document "$PWD/tmp/rsi-health/rsi-health-bundle.json"

      - name: Integration smoke
        run: scripts/ao-command-smoke.sh --forge ao-forge --out tmp/ao-command-smoke

      - name: RSI evidence chain smoke
        run: scripts/rsi-evidence-chain-smoke.sh --forge ao-forge --foundry ao-foundry --covenant ao-covenant --out tmp/rsi-evidence-chain-smoke

      - name: Active stack status
        run: go run ./cmd/ao-command stack --ledger ao-foundry/examples/readiness/active-stack-readiness.ledger.json

      - name: RSI claim manifest
        run: go run ./cmd/ao-command rsi manifest --manifest ao-architecture/overview/rsi-claim-evidence-manifest.json

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ao-command
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest

  production-readiness:
    name: Production readiness audit
    runs-on: ubuntu-latest
    needs:
      - go
      - workflow-lint
    steps:
      - name: Checkout ao-command
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout ao-forge integration fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao-forge
          path: ao-forge

      - name: Checkout ao-foundry active-stack fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao-foundry
          path: ao-foundry

      - name: Checkout ao-covenant claim-boundary fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao-covenant
          path: ao-covenant

      - name: Checkout ao-architecture RSI manifest fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao-architecture
          path: ao-architecture

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Release preview dry-run
        run: |
          scripts/release-preview-dry-run.sh --forge ao-forge --out tmp/release-preview --tag v0.1.1-preview

      - name: Validate release preview contract
        run: |
          go run ./cmd/ao-command evidence \
            --forge ao-forge \
            --schema "$PWD/docs/contracts/release-preview-audit-v0.1.schema.json" \
            --document "$PWD/tmp/release-preview/release-preview-audit.json"

      - name: Install verification dry-run
        run: |
          scripts/install-verify-dry-run.sh --forge ao-forge --out tmp/install-verify

      - name: Validate install verification contract
        run: |
